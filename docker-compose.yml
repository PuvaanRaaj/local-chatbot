version: "3.8"

services:
  chatbot:
    image: chatbot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot
    ports:
      - "12345:12345"
      - "12346:12346"
    environment:
      - FLASK_ENV=development
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mysqlroot}
    networks:
      - aws_molpay
    command: sh -c "python app.py & /app/go-server"

networks:
  aws_molpay:
    external: true
